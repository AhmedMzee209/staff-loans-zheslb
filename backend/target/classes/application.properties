spring.application.name=staffloan



# ---------------------------
# DATABASE CONFIGURATION
# ---------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/staffloans_zheslb_db
spring.datasource.username=postgres
spring.datasource.password=kifaki209

# Optional: PostgreSQL driver class (Spring Boot auto-detects it, but you can specify)
#spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------
# JPA & HIBERNATE CONFIG
# ---------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------
# SWAGGER/OPENAPI CONFIG
# ---------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.packages-to-scan=com.zheslb.staffloan.controller
springdoc.paths-to-match=/api/**

# ---------------------------
# SERVER CONFIGURATION
# ---------------------------
server.port=8080

# ---------------------------
# FILE UPLOAD CONFIGURATION
# ---------------------------
app.upload.dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------
# JWT CONFIGURATION
# ---------------------------
app.jwt.secret=ZHVtbXlTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb24xMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMw==
app.jwt.expiration=86400000

logging.level.org.springframework.security=DEBUG




